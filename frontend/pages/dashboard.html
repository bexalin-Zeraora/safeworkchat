<!DOCTYPE html><html lang="en"><head>

</head><body><div class="app"><aside class="sb"><div class="brand"><img src="/images/logo.svg" alt=""><div>Safe WorkChat<small>Secure Conversations</small></div></div>

<a href="/pages/chat.html"><i class="fas fa-comment-dots"></i>Chats</a>

<div class="cd stat"><div class="ic i-o"><i class="fas fa-spinner"></i></div><div><span>In Progress</span><b id="statProgress">0</b></div></div>
<div class="cd stat"><div class="ic i-g"><i class="fas fa-check-circle"></i></div><div><span>Completed</span><b id="statDone">0</b></div></div>
<div class="cd stat"><div class="ic i-r"><i class="fas fa-exclamation-triangle"></i></div><div><span>Overdue</span><b id="statOverdue">0</b></div></div></div>
