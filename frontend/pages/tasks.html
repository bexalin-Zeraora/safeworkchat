<!DOCTYPE html><html lang="en"><head>
<script src="/js/session.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Safe WorkChat - Tasks</title>
<link rel="stylesheet" href="/vendor/bootstrap.min.css"><link rel="stylesheet" href="/vendor/all.min.css"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/tasks.css"><link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<script src="/js/avatar.js"></script>
</head>
<body><div class="app">
<aside class="sb"><div class="brand"><img src="/images/logo.svg" alt=""><div>Safe WorkChat<small>Secure Conversations</small></div></div>
<a href="/pages/dashboard.html"><i class="fas fa-home"></i>Home</a>
<a href="/pages/chat.html"><i class="fas fa-comment-dots"></i>Chats</a>
<a href="/pages/groups.html"><i class="fas fa-users"></i>Groups</a>
<a href="/pages/friends.html"><i class="fas fa-user-friends"></i>Friends</a>
<a href="/pages/tasks.html" class="active"><i class="fas fa-tasks"></i>Tasks</a>
<a href="/pages/documents.html"><i class="fas fa-file-alt"></i>Documents</a>
<a href="/pages/calendar.html"><i class="fas fa-calendar-alt"></i>Calendar</a>
<div class="sp"></div><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i>Logout</a></aside>
<div class="mn"><div class="tb"><div class="search"><i class="fas fa-search"></i><input placeholder="Search chats, groups, or people..."></div><div class="conn">Connected to local MongoDB</div></div>
<div class="pg pgw" id="view">Loading…</div></div></div>
<div class="modal fade" id="taskModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Assign Task</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
<div id="taskError" class="text-danger small mb-2"></div>
<label class="lbl">Group</label><select id="tGroup" class="fld"></select>
<label class="lbl">Task title</label><input id="tTitle" class="fld" maxlength="120" placeholder="e.g. Finish backend API">
<label class="lbl">Description (optional)</label><textarea id="tDesc" class="fld" rows="2"></textarea>
<div class="row g-2"><div class="col-7"><label class="lbl">Assign to</label><select id="tAssignee" class="fld"></select></div><div class="col-5"><label class="lbl">Priority</label><select id="tPriority" class="fld"><option>Low</option><option selected>Medium</option><option>High</option></select></div></div>
<label class="lbl">Deadline</label><input id="tDue" type="datetime-local" class="fld"></div>
<div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button id="saveTask" class="btn btn-success">Assign</button></div></div></div></div>
<script src="/vendor/bootstrap.bundle.min.js"></script><script src="/js/tasks.js"></script><script src="/js/nav.js"></script></body></html>
