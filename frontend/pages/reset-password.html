<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/session.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe WorkChat - Reset password</title>
<link rel="stylesheet" href="/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/vendor/all.min.css">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/login-skin.css">
<link rel="stylesheet" href="/css/password.css">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">
<div class="login-container" style="max-width:520px;margin:6vh auto">
  <div class="login-right" style="width:100%"><div class="form-container">
    <div class="form-header"><h2>Choose a new password</h2><p class="text-muted">Safe WorkChat</p></div>
    <div id="alertBox" class="alert hidden" role="alert"></div>
    <form id="resetForm">
      <div class="mb-3"><label class="form-label">New password</label>
        <input type="password" class="form-control custom-input" id="np" autocomplete="new-password" required><div id="pwRules"></div></div>
      <div class="mb-3"><label class="form-label">Confirm new password</label>
        <input type="password" class="form-control custom-input" id="np2" autocomplete="new-password" required></div>
      <button type="submit" class="btn btn-success btn-block mb-3" id="rb"><i class="fas fa-key me-2"></i>Change password</button>
      <div class="text-center"><a href="/pages/login.html" class="text-primary fw-bold">Back to login</a></div>
    </form>
  </div></div>
</div>
<script src="/js/passwordRules.js"></script>
<script src="/js/reset-password.js"></script>
</body></html>
